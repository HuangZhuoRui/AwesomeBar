name: Release macOS

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check if Version Changed
        id: check_version
        run: |
          RAW_VERSION=$(grep 'MARKETING_VERSION = ' AwesomeBar.xcodeproj/project.pbxproj | head -n 1 | sed 's/.*MARKETING_VERSION = \(.*\);/\1/')
          VERSION=$(echo "$RAW_VERSION" | tr -d ' ' | tr -d '"' | tr -d ';')
          echo "App Version: $VERSION (Raw: $RAW_VERSION)"

          TAG_NAME="v$VERSION"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists, version has not changed. Skipping build."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "New version detected: $TAG_NAME"
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        if: steps.check_version.outputs.changed == 'true'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            LOGS=$(git log --no-merges --pretty=format:"- %s" | grep -v -i -E '^- *(tmp:|tmp：|tmp |temp:|temp )' || echo "")
          else
            LOGS=$(git log $PREV_TAG..HEAD --no-merges --pretty=format:"- %s" | grep -v -i -E '^- *(tmp:|tmp：|tmp |temp:|temp )' || echo "")
          fi

          echo "### AwesomeBar ${{ steps.check_version.outputs.tag }} 更新内容" > changelog.txt
          echo "" >> changelog.txt
          echo "$LOGS" >> changelog.txt
          cat changelog.txt

      - name: Import Code-Signing Certificate
        if: steps.check_version.outputs.changed == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          echo "=== 已导入的签名身份 ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build macOS Release App
        if: steps.check_version.outputs.changed == 'true'
        run: |
          mkdir -p build/dist

          echo "=== 正在执行 xcodebuild 编译并签名 Release 产物 ==="
          xcodebuild -project AwesomeBar.xcodeproj \
            -scheme AwesomeBar \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

          APP_PATH="build/DerivedData/Build/Products/Release/AwesomeBar.app"
          if [ ! -d "$APP_PATH" ]; then
            # 兼容 Debug 目录回退检索
            APP_PATH=$(find build/DerivedData -name "AwesomeBar.app" -type d | head -n 1)
          fi

          echo "App Path: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

          echo "=== 校验代码签名 ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          echo "=== 签名身份详情（确认是否为 Developer ID Application）==="
          codesign -dvvv "$APP_PATH" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp"

      - name: Notarize App
        if: steps.check_version.outputs.changed == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"

          echo "=== 压缩用于公证提交的临时 Zip ==="
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"

          echo "=== 提交 Apple 公证服务并等待结果 ==="
          NOTARY_JSON="$RUNNER_TEMP/notary_result.json"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format json | tee "$NOTARY_JSON"

          SUBMISSION_ID=$(jq -r '.id' "$NOTARY_JSON")
          STATUS=$(jq -r '.status' "$NOTARY_JSON")

          echo "=== 拉取详细公证日志（Submission ID: $SUBMISSION_ID）==="
          xcrun notarytool log "$SUBMISSION_ID" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"

          if [ "$STATUS" != "Accepted" ]; then
            echo "❌ 公证被 Apple 拒绝，状态：$STATUS，详情见上方日志"
            exit 1
          fi

          echo "=== 将公证票据装订到 App 上 ==="
          xcrun stapler staple "$APP_PATH"

      - name: Package Release Artifacts
        if: steps.check_version.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.check_version.outputs.version }}"
          mkdir -p build/dist

          # 1. 打包 Zip 格式产物
          ZIP_NAME="AwesomeBar $VERSION.zip"
          cd "$(dirname "$APP_PATH")"
          zip -r -y -q "$GITHUB_WORKSPACE/build/dist/$ZIP_NAME" "AwesomeBar.app"
          cd "$GITHUB_WORKSPACE"

          # 2. 打包 DMG 格式产物
          DMG_NAME="AwesomeBar $VERSION.dmg"
          hdiutil create -volname "AwesomeBar $VERSION" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "build/dist/$DMG_NAME"

          echo "=== 检查生成的发布产物 ==="
          ls -lh build/dist/

      - name: Clean Up Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - name: Tag Repository
        if: steps.check_version.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.check_version.outputs.tag }}
          git push origin ${{ steps.check_version.outputs.tag }}

      - name: Publish GitHub Release
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: AwesomeBar ${{ steps.check_version.outputs.tag }}
          body_path: changelog.txt
          files: |
            build/dist/AwesomeBar *.dmg
            build/dist/AwesomeBar *.zip
